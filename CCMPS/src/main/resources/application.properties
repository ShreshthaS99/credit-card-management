spring.application.name=credit-card-api

server.port=8080


# ==============================
# MySQL
# ==============================

spring.datasource.url=jdbc:mysql://localhost:3306/credit_card_db

spring.datasource.username=credit_card_user

spring.datasource.password=local_dev_password


# ==============================
# JPA and Hibernate
# ==============================

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false


# ==============================
# JWT
# ==============================

app.jwt.secret=CardwiseLocalDevelopmentSecretKeyMustHaveAtLeastThirtyTwoCharacters123

app.jwt.expiration-ms=3600000


# ==============================
# Development error handling
# ==============================

server.error.include-message=always

server.error.include-binding-errors=always