spring.cloud.openfeign.circuitbreaker.enabled=true
spring.cloud.openfeign.circuitbreaker.alphanumeric-ids.enabled=true
spring.cloud.openfeign.client.config.default.connectTimeout=1500
spring.cloud.openfeign.client.config.default.readTimeout=3000
spring.cloud.circuitbreaker.resilience4j.disable-time-limiter=true
spring.cloud.circuitbreaker.bulkhead.resilience4j.enabled=false
resilience4j.circuitbreaker.configs.default.slidingWindowSize=10
resilience4j.circuitbreaker.configs.default.minimumNumberOfCalls=5
resilience4j.circuitbreaker.configs.default.failureRateThreshold=50
resilience4j.circuitbreaker.configs.default.waitDurationInOpenState=10s
resilience4j.circuitbreaker.configs.default.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.configs.default.recordFailurePredicate=com.example.ccmps.client.RemoteFailurePredicate
app.jwt.issuer=ccmps-auth
app.jwt.audience=ccmps-api
app.jwt.expiration-seconds=900
app.cors.origin=${FRONTEND_ORIGIN:http://localhost:5173}
