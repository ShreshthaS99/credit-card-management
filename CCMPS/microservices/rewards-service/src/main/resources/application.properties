spring.application.name=rewards-service
server.port=${PORT:8097}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=${SERVICE_HOST:127.0.0.1}
eureka.instance.instance-id=${spring.application.name}:${server.port}
spring.config.import=classpath:platform-defaults.properties
app.jwt.secret=${JWT_SECRET}
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/rewards-service;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.datasource.hikari.maximum-pool-size=5
